services:
  postgres:
    image: postgres:16-alpine
    container_name: openfamily-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openfamily}
      POSTGRES_USER: ${POSTGRES_USER:-openfamily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfamily}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
    container_name: openfamily-server
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-openfamily}
      POSTGRES_USER: ${POSTGRES_USER:-openfamily}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SERVER_PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      # The family's time zone. Appointments are stored in local time; without
      # it the container runs in UTC and reminders arrive one or two hours late.
      TZ: ${TZ:-Europe/Paris}
      # Optional features documented in .env.example. A variable set in .env
      # only reaches the server if it is listed here; without these lines,
      # invitation and password-reset e-mails could never be sent from a
      # Docker install, however .env was filled. Empty = feature off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      # FORK-START: deploy
      # Weather (Open-Meteo) — key-less, so these only matter to point at a
      # mirror or lengthen the server-side cache. Unset = the built-in defaults.
      CUSTOM_OPEN_METEO_BASE_URL: ${CUSTOM_OPEN_METEO_BASE_URL:-https://api.open-meteo.com/v1/forecast}
      CUSTOM_OPEN_METEO_GEOCODING_URL: ${CUSTOM_OPEN_METEO_GEOCODING_URL:-https://geocoding-api.open-meteo.com/v1/search}
      CUSTOM_WEATHER_DEFAULT_LANG: ${CUSTOM_WEATHER_DEFAULT_LANG:-fr}
      CUSTOM_WEATHER_CACHE_TTL_MS: ${CUSTOM_WEATHER_CACHE_TTL_MS:-600000}
      CUSTOM_WEATHER_REQUEST_TIMEOUT_MS: ${CUSTOM_WEATHER_REQUEST_TIMEOUT_MS:-8000}
      # Outing planner (OpenStreetMap Overpass) — key-less too. The default is
      # the public instance; a household that hits its rate limit points these at
      # a mirror, shortens the radius or lengthens the (12 h) cache instead.
      CUSTOM_OVERPASS_URL: ${CUSTOM_OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      CUSTOM_OVERPASS_TIMEOUT_MS: ${CUSTOM_OVERPASS_TIMEOUT_MS:-20000}
      CUSTOM_OUTINGS_RADIUS_KM: ${CUSTOM_OUTINGS_RADIUS_KM:-10}
      CUSTOM_OUTINGS_CACHE_TTL_MS: ${CUSTOM_OUTINGS_CACHE_TTL_MS:-43200000}
      # Promo watchlist deals (PrijsProfeet) — its free plan needs no key, so the
      # key only raises the rate limit. `be` = the Belgian chains, `nl` = the
      # Dutch ones, `be,nl` = both merged into one list.
      CUSTOM_PRIJSPROFEET_API_KEY: ${CUSTOM_PRIJSPROFEET_API_KEY:-}
      CUSTOM_PRIJSPROFEET_COUNTRIES: ${CUSTOM_PRIJSPROFEET_COUNTRIES:-be}
      # Feature kill switches. Listed here for the same reason as the block
      # above: a variable set in .env only reaches the container through this
      # `environment:` map, so without these lines a Docker install could not
      # turn a fork feature off (unset = enabled, the server's own default).
      CUSTOM_FEATURE_WEATHER_ENABLED: ${CUSTOM_FEATURE_WEATHER_ENABLED:-true}
      CUSTOM_FEATURE_AI_WIDGETS_ENABLED: ${CUSTOM_FEATURE_AI_WIDGETS_ENABLED:-true}
      CUSTOM_FEATURE_MEDIA_ENABLED: ${CUSTOM_FEATURE_MEDIA_ENABLED:-true}
      CUSTOM_FEATURE_BUDGET_RECEIPTS_ENABLED: ${CUSTOM_FEATURE_BUDGET_RECEIPTS_ENABLED:-true}
      CUSTOM_FEATURE_BUDGET_ANALYTICS_ENABLED: ${CUSTOM_FEATURE_BUDGET_ANALYTICS_ENABLED:-true}
      CUSTOM_FEATURE_LUNCHBOX_ENABLED: ${CUSTOM_FEATURE_LUNCHBOX_ENABLED:-true}
      CUSTOM_FEATURE_PANTRY_ENABLED: ${CUSTOM_FEATURE_PANTRY_ENABLED:-true}
      CUSTOM_FEATURE_OUTINGS_ENABLED: ${CUSTOM_FEATURE_OUTINGS_ENABLED:-true}
      CUSTOM_FEATURE_SCANNER_ENABLED: ${CUSTOM_FEATURE_SCANNER_ENABLED:-true}
      CUSTOM_FEATURE_FAMILY_DASHBOARD_ENABLED: ${CUSTOM_FEATURE_FAMILY_DASHBOARD_ENABLED:-true}
      # FORK-END: deploy
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      ANDROID_PACKAGE_NAME: ${ANDROID_PACKAGE_NAME:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:3001/health >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        # Empty → same-origin; nginx proxies /api and /ws to the server, so the app
        # works from any device. Set these only to serve the API from a separate origin.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_WS_URL: ${VITE_WS_URL:-}
        # The login page asks the server whether sign-ups are open; this only
        # sets what it shows until the server has answered.
        VITE_REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
    container_name: openfamily-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1 >/dev/null 2>&1 || exit 1" ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
    driver: local
